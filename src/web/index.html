<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>sub2api-guard · 状态</title>
<style>
  :root {
    --ink: #0f1729;
    --ink-2: #313c55;
    --muted: #5b6783;
    --faint: #8c97ad;
    --rule: #d6ddee;
    --rule-2: #b3c1e0;
    --accent: #2554ff;
    --wash: #f3f6ff;
    --fine: rgba(37, 84, 255, 0.045);
    --bold: rgba(37, 84, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink-2);
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1;
    background-color: #fff;
    background-image:
      linear-gradient(to right, var(--fine) 1px, transparent 1px),
      linear-gradient(to bottom, var(--fine) 1px, transparent 1px),
      linear-gradient(to right, var(--bold) 1px, transparent 1px),
      linear-gradient(to bottom, var(--bold) 1px, transparent 1px);
    background-size: 8px 8px, 8px 8px, 40px 40px, 40px 40px;
  }

  /* ---- sheet and frame --------------------------------------------------- */
  .sheet { max-width: 1240px; margin: 0 auto; padding: 26px 24px 40px; }
  .frame {
    position: relative;
    border: 1px solid var(--rule-2);
    background: rgba(255, 255, 255, 0.93);
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: -5px;
    border: 1px solid var(--rule);
    pointer-events: none;
  }
  .plate {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding: 11px 26px;
    border-bottom: 1px solid var(--rule-2);
  }
  .mark {
    font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    color: var(--ink);
  }
  .mark span {
    margin-left: 12px;
    padding-left: 12px;
    border-left: 1px solid var(--rule-2);
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  .info { display: flex; flex-wrap: wrap; align-items: baseline; }
  .info-item { display: flex; align-items: baseline; gap: 6px; padding: 0 14px; }
  .info-item + .info-item { border-left: 1px solid var(--rule); }
  .info-k {
    font: 500 9.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
  .info-v {
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .info-sub {
    display: block;
    font: 400 9.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    color: var(--faint);
  }
  .logout { display: flex; margin-left: auto; }
  .btn {
    padding: 3px 8px;
    border: 1px solid var(--rule-2);
    background: transparent;
    color: var(--muted);
    font: 500 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.12em;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { color: var(--accent); border-color: var(--accent); }
  .btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover, .btn.primary:focus-visible { color: #fff; background: #1a44e0; }
  .btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); background: var(--wash); }
  .btn:disabled { color: var(--faint); border-color: var(--rule); background: transparent; cursor: default; }

  /* ---- sections ---------------------------------------------------------- */
  .section + .section { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--rule-2); }

  /* ---- drawing text ------------------------------------------------------ */
  .doc { counter-reset: sec; padding: 24px 26px 40px; }
  .doc h2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 14px;
    font-size: 19px;
    line-height: 1.35;
    font-weight: 650;
    letter-spacing: -0.008em;
    color: var(--ink);
    scroll-margin-top: 16px;
  }
  .doc h2::before {
    counter-increment: sec;
    content: counter(sec, decimal-leading-zero);
    flex: none;
    padding: 2px 5px 1px;
    border: 1px solid var(--accent);
    font: 600 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .doc h2 .t { flex: 0 1 auto; min-width: 0; }
  .doc h2 .dim { position: relative; flex: 1; min-width: 18px; height: 9px; }
  .doc h2 .dim::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 4px;
    height: 1px;
    background: var(--rule-2);
  }
  .doc h2 .dim::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 9px;
    border-left: 1px solid var(--rule-2);
    border-right: 1px solid var(--rule-2);
  }
  .h2-note {
    flex: none;
    font: 500 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: var(--faint);
  }

  /* ---- note -------------------------------------------------------------- */
  .note {
    margin: 0 0 18px;
    padding: 11px 14px 9px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    background: #fbfcff;
  }
  .note-k {
    margin: 0 0 4px;
    font: 600 9.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .note-body { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink); overflow-wrap: anywhere; }
  .note-body b { font: 600 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; }
  .note-body span { margin-left: 8px; color: var(--muted); }
  .note[hidden] { display: none; }

  /* ---- drawing tables ---------------------------------------------------- */
  .table {
    width: 100%;
    border-collapse: collapse;
    border-top: 1.5px solid var(--accent);
    font-size: 13px;
    line-height: 1.6;
  }
  .table th {
    padding: 7px 8px 6px;
    border-bottom: 1px solid var(--rule-2);
    background: var(--wash);
    text-align: left;
    vertical-align: bottom;
    font: 600 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.06em;
    color: var(--muted);
    white-space: nowrap;
  }
  .table th.th-num { text-align: right; }
  .th-sub { display: block; font-weight: 400; font-size: 9.5px; letter-spacing: 0.08em; color: var(--faint); }
  .table td { padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .table tbody tr:last-child td { border-bottom: 1px solid var(--rule-2); }
  .table .empty { padding: 14px 10px; color: var(--faint); }
  .table tr[data-attention="true"] .c-event { color: var(--accent); }

  .account-name { color: var(--ink); font-size: 13.5px; overflow-wrap: anywhere; }
  .account-id {
    margin-left: 6px;
    font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.04em;
    color: var(--faint);
    white-space: nowrap;
  }
  .figure { font-weight: 600; color: var(--ink); }
  .figure.over { color: var(--accent); }

  .capacity { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .blocks { display: inline-flex; gap: 3px; }
  .block { width: 7px; height: 13px; border: 1px solid var(--rule-2); }
  .block.on { background: var(--ink); border-color: var(--ink); }
  .of { color: var(--muted); font-size: 12px; }

  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .state i { flex: none; width: 6px; height: 6px; border: 1px solid var(--rule-2); background: var(--faint); }
  .state[data-kind="ok"] { color: var(--ink-2); }
  .state[data-kind="ok"] i { background: var(--ink); border-color: var(--ink); }
  .state[data-kind="cooldown"] { color: var(--accent); }
  .state[data-kind="cooldown"] i { background: var(--accent); border-color: var(--accent); }
  .state[data-kind="unusable"] i { background: transparent; }
  .state[data-kind="closed"] { color: var(--faint); }
  .state[data-kind="closed"] i { background: transparent; border-color: var(--faint); }

  .rate { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .rate .figure { min-width: 38px; }
  .meter {
    position: relative;
    flex: 1;
    min-width: 48px;
    height: 6px;
    border: 1px solid var(--rule-2);
    background: var(--wash);
  }
  .meter i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
  .meter.over { border-color: var(--accent); }
  .meter.over i { background: var(--accent); }
  .meter b { position: absolute; top: -3px; bottom: -3px; width: 1px; margin-left: -0.5px; background: var(--ink-2); }

  .tally { white-space: nowrap; }
  .quiet { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .c-time time { font: 500 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.04em; color: var(--faint); }
  .c-event { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .c-change { white-space: nowrap; font-size: 12.5px; }
  .c-change .arrow { margin: 0 4px; color: var(--faint); }
  .decisions .account-id { margin-left: 0; margin-right: 6px; }
  .decisions .c-rate { text-align: right; font: 500 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--faint); white-space: nowrap; }

  .is-closed .account-name,
  .is-closed .figure,
  .is-closed .figure.over { color: var(--faint); }
  .is-closed .block.on { background: var(--faint); border-color: var(--faint); }
  .is-closed .meter { border-color: var(--rule-2); }
  .is-closed .meter i { background: var(--faint); }

  .c-num { font-size: 12.5px; white-space: nowrap; }
  .c-num .unset { color: var(--faint); }
  .c-action { text-align: right; }

  /* ---- manual editor ----------------------------------------------------- */
  .accounts tr.is-editing td { border-bottom-color: transparent; }
  .accounts tr.editor td { padding: 0 8px 14px; background: transparent; }
  .editor-box {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px 18px;
    padding: 12px 14px;
    border: 1px solid var(--rule-2);
    border-left: 3px solid var(--accent);
    background: #fbfcff;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field-k {
    font: 600 9.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.14em;
    color: var(--faint);
  }
  .field input {
    width: 92px;
    padding: 3px 7px;
    border: 1px solid var(--rule-2);
    background: #fff;
    color: var(--ink);
    font: 500 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .field input:focus { outline: 1px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .field input::placeholder { color: var(--faint); }
  .editor-actions { display: flex; gap: 8px; align-items: center; }
  .editor-split { align-self: stretch; width: 1px; background: var(--rule); }
  .editor-msg { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--muted); min-height: 1.6em; }
  .editor-msg[data-kind="error"] { color: #c0312b; }
  .editor-msg[data-kind="ok"] { color: var(--accent); }

  @media (max-width: 880px) {
    .sheet { padding: 12px 16px 28px; }
    .frame::before { inset: -3px; }
    .plate { gap: 6px 12px; padding: 10px 14px; }
    .info-item { padding: 0 10px; }
    .doc { padding: 18px 14px 32px; }
    .doc h2 { font-size: 17px; }
  }
  @media (max-width: 760px) {
    .table, .table tbody, .table tr, .table td { display: block; }
    .table thead { display: none; }
    .table tr { padding: 12px 0 11px; border-bottom: 1px solid var(--rule); }
    .table tbody tr:last-child { border-bottom: 1px solid var(--rule-2); }
    .table td, .table tbody tr:last-child td { border: 0; padding: 0; }
    .table td[data-label]::before {
      content: attr(data-label);
      display: block;
      margin-bottom: 1px;
      font: 600 9.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.14em;
      color: var(--faint);
    }
    .accounts tr {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "account state"
        "capacity errors"
        "priority load"
        "rate rate"
        "changed action";
      align-items: baseline;
      gap: 8px 12px;
    }
    .c-account { grid-area: account; }
    .c-state { grid-area: state; justify-self: end; }
    .c-capacity { grid-area: capacity; }
    .c-errors { grid-area: errors; justify-self: end; }
    .c-priority { grid-area: priority; }
    .c-load { grid-area: load; justify-self: end; text-align: right; }
    .c-rate { grid-area: rate; }
    .c-changed { grid-area: changed; }
    .c-action { grid-area: action; justify-self: end; align-self: center; }
    .accounts tr.editor { display: block; padding: 0 0 14px; }
    .accounts tr.editor td { padding: 0; }
    .accounts tr.is-editing { border-bottom: 0; }
    .field input { width: 120px; }
    .editor-split { display: none; }
    .decisions tr {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "time event"
        "account account"
        "change rate";
      align-items: baseline;
      gap: 3px 10px;
    }
    .c-time { grid-area: time; }
    .c-event { grid-area: event; }
    .decisions .c-account { grid-area: account; }
    .decisions .c-change { grid-area: change; }
    .decisions .c-rate { grid-area: rate; justify-self: end; }
    .decisions td[data-label]::before { display: inline; margin: 0 6px 0 0; }
    .table tr.empty { display: block; }
  }
</style>
</head>
<body>
<div class="sheet">
<div class="frame">
  <header class="plate">
    <span class="mark">SUB2API-GUARD<span>第 <b id="group">—</b> 组</span></span>
    <div class="info">
      <span class="info-item"><span class="info-k">模式</span><span class="info-v" id="mode">—</span></span>
      <span class="info-item"><span class="info-k">上次检查</span><span class="info-v" id="last-tick">—</span></span>
      <span class="info-item"><span class="info-k">阈值</span><span class="info-v"><span id="threshold">—</span><span class="info-sub" id="threshold-sub"></span></span></span>
      <span class="info-item"><span class="info-k">保底</span><span class="info-v" id="floor">—</span></span>
      <span class="info-item"><span class="info-k">恢复</span><span class="info-v" id="reopen">—</span></span>
      <span class="info-item"><span class="info-k">更新</span><span class="info-v" id="updated">正在加载…</span></span>
    </div>
    <form method="post" action="/logout" class="logout">
      <button type="submit" class="btn">退出</button>
    </form>
  </header>
  <article class="doc">
    <div class="note" id="alert" hidden>
      <p class="note-k">检查异常</p>
      <p class="note-body" id="alert-body"></p>
    </div>
    <section class="section">
      <h2 id="accounts"><span class="t">账号</span><i class="dim" aria-hidden="true"></i><span class="h2-note" id="account-count"></span></h2>
      <table class="table accounts">
        <thead>
          <tr>
            <th>账号</th>
            <th>容量</th>
            <th>优先级</th>
            <th>负载因子</th>
            <th>状态</th>
            <th>错误率<span class="th-sub" id="rate-window"></span></th>
            <th>错误 / 总数</th>
            <th>上次调整</th>
            <th class="th-num">操作</th>
          </tr>
        </thead>
        <tbody id="accounts-body"></tbody>
      </table>
    </section>

    <section class="section">
      <h2 id="decisions"><span class="t">决策</span><i class="dim" aria-hidden="true"></i><span class="h2-note" id="decision-count"></span></h2>
      <table class="table decisions">
        <thead>
          <tr>
            <th>时间</th>
            <th>事件</th>
            <th>账号</th>
            <th>变化</th>
            <th class="th-num">错误率</th>
          </tr>
        </thead>
        <tbody id="decisions-body"></tbody>
      </table>
    </section>
  </article>
</div>
</div>
<script>
  const clockFormat = new Intl.DateTimeFormat("zh-CN", {
    timeZone: "Asia/Shanghai",
    hour12: false,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
  });
  const eventLabels = {
    decrease: "降容量",
    increase: "升容量",
    close: "关闭调度",
    floor_blocked: "保底拦截",
    reopen: "恢复调度",
    manual: "手动调整",
  };
  const attentionEvents = new Set(["decrease", "close", "floor_blocked"]);
  const fieldLabels = {
    concurrency: "并发数",
    priority: "优先级",
    loadFactor: "负载因子",
    schedulable: "调度",
  };

  const nodes = {
    group: document.querySelector("#group"),
    mode: document.querySelector("#mode"),
    lastTick: document.querySelector("#last-tick"),
    threshold: document.querySelector("#threshold"),
    thresholdSub: document.querySelector("#threshold-sub"),
    floor: document.querySelector("#floor"),
    reopen: document.querySelector("#reopen"),
    updated: document.querySelector("#updated"),
    alert: document.querySelector("#alert"),
    alertBody: document.querySelector("#alert-body"),
    accounts: document.querySelector("#accounts-body"),
    accountCount: document.querySelector("#account-count"),
    decisions: document.querySelector("#decisions-body"),
    decisionCount: document.querySelector("#decision-count"),
    rateWindow: document.querySelector("#rate-window"),
  };

  function h(tag, className, ...children) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    for (const child of children) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  function cell(className, label, ...children) {
    const node = h("td", className, ...children);
    if (label) node.dataset.label = label;
    return node;
  }

  function emptyRow(message, columns) {
    const node = h("td", "empty", message);
    node.colSpan = columns;
    return h("tr", "empty", node);
  }

  const formatClock = (value) => clockFormat.format(new Date(value));
  const formatRate = (rate) => `${(rate * 100).toFixed(1)}%`;
  const formatHours = (minutes) => String(Math.round((minutes / 60) * 10) / 10);

  function relativeTime(value, now) {
    if (!value) return "从未";
    const minutes = Math.round((now - Date.parse(value)) / 60000);
    if (minutes <= 0) return "刚刚";
    if (minutes < 60) return `${minutes} 分钟前`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} 小时前`;
    return `${Math.round(hours / 24)} 天前`;
  }

  function reopenLabel(reopenAt, now) {
    if (!reopenAt) return "手动关闭";
    const minutes = Math.round((Date.parse(reopenAt) - now) / 60000);
    if (minutes <= 0) return "已关闭 · 即将恢复";
    if (minutes >= 60) return `已关闭 · ${Math.round(minutes / 60)} 小时后恢复`;
    return `已关闭 · ${minutes} 分钟后恢复`;
  }

  function accountState(account, policy, now) {
    if (account.closed) return { label: reopenLabel(account.reopenAt, now), kind: "closed" };
    if (!account.usable) return { label: "暂不可用", kind: "unusable" };
    const changedAt = account.lastChangeAt ? Date.parse(account.lastChangeAt) : 0;
    if (now - changedAt < policy.cooldownMinutes * 60000) return { label: "冷却中", kind: "cooldown" };
    return { label: "可调度", kind: "ok" };
  }

  function rateBar(recent, policy) {
    // The track covers three times the policy threshold, so small rates stay readable.
    const scale = Math.max(policy.errorRate * 3, 0.03);
    const over = recent.rate >= policy.errorRate;
    const track = h("span", over ? "meter over" : "meter", h("i"), h("b"));
    track.querySelector("i").style.width = `${Math.min(recent.rate / scale, 1) * 100}%`;
    track.querySelector("b").style.left = `${Math.min(policy.errorRate / scale, 1) * 100}%`;
    return track;
  }

  function capacityBlocks(account) {
    const blocks = h("span", "blocks");
    const count = Math.max(account.maxConcurrency, account.concurrency);
    for (let index = 0; index < count; index += 1) {
      blocks.append(h("i", index < account.concurrency ? "block on" : "block"));
    }
    return blocks;
  }

  function actionCell(account, manualEnabled) {
    if (!manualEnabled) {
      const off = h("span", "quiet", "—");
      off.title = "没有设置 ADMIN_API_KEY，不能手动调整";
      return cell("c-action", null, off);
    }
    const button = h("button", "btn", "调整");
    button.type = "button";
    button.setAttribute("aria-expanded", String(editor?.id === account.id));
    button.addEventListener("click", () => toggleEditor(account));
    return cell("c-action", null, button);
  }

  function renderAccount(account, policy, now, manualEnabled) {
    const state = accountState(account, policy, now);
    const stateNode = h("span", "state", h("i"), state.label);
    stateNode.dataset.kind = state.kind;
    const classes = [account.closed && "is-closed", editor?.id === account.id && "is-editing"].filter(Boolean);

    return h("tr", classes.join(" ") || null,
      cell("c-account", null,
        h("span", "account-name", account.name),
        h("span", "account-id", `#${account.id}`),
      ),
      cell("c-capacity", "容量",
        h("span", "capacity",
          capacityBlocks(account),
          h("span", "of", h("b", "figure", account.concurrency), ` / ${account.maxConcurrency}`),
        ),
      ),
      cell("c-num c-priority", "优先级", h("b", "figure", account.priority)),
      cell("c-num c-load", "负载因子",
        account.loadFactor === null ? h("span", "unset", "默认") : h("b", "figure", account.loadFactor),
      ),
      cell("c-state", null, stateNode),
      cell("c-rate", "错误率",
        h("span", "rate",
          h("b", account.recent.rate >= policy.errorRate ? "figure over" : "figure", formatRate(account.recent.rate)),
          rateBar(account.recent, policy),
        ),
      ),
      cell("c-errors", "错误 / 总数",
        h("span", "tally", h("b", "figure", account.recent.errors), ` / ${account.recent.total}`),
      ),
      cell("c-changed", "上次调整", h("span", "quiet", relativeTime(account.lastChangeAt, now))),
      actionCell(account, manualEnabled),
    );
  }

  // ---- manual editor --------------------------------------------------------
  // The editor row is built once per opened account and re-attached on every refresh,
  // so typed values survive the 15-second re-render.
  let editor = null;
  let latest = null;

  const numberFields = ["concurrency", "loadFactor", "priority"];

  function formatValue(field, value) {
    if (field === "schedulable") return value ? "开" : "关";
    if (field === "loadFactor" && value === null) return "默认";
    return String(value);
  }

  async function postChange(id, change) {
    const response = await fetch(`/api/accounts/${id}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(change),
    });
    if (response.status === 401) {
      location.reload();
      return;
    }
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error ?? `HTTP ${response.status}`);
  }

  function buildEditor(account) {
    const inputs = {};
    const fields = numberFields.map((field) => {
      const input = h("input");
      input.type = "number";
      input.inputMode = "numeric";
      input.step = "1";
      input.min = field === "priority" ? "0" : "1";
      if (field === "loadFactor") {
        input.max = "10000";
        input.placeholder = "默认";
      }
      input.value = account[field] === null ? "" : String(account[field]);
      inputs[field] = input;
      const label = h("label", "field", h("span", "field-k", fieldLabels[field]), input);
      return label;
    });

    const save = h("button", "btn primary", "保存");
    save.type = "button";
    const close = h("button", "btn", "收起");
    close.type = "button";
    const toggle = h("button", "btn");
    toggle.type = "button";
    const message = h("p", "editor-msg");

    const box = h("div", "editor-box",
      ...fields,
      h("div", "editor-actions", save, close),
      h("i", "editor-split"),
      h("div", "editor-actions", toggle),
      message,
    );
    const td = h("td", null, box);
    td.colSpan = 9;
    const row = h("tr", "editor", td);

    const state = { id: account.id, row, account, initial: { ...account } };

    function say(text, kind) {
      message.textContent = text;
      if (kind) message.dataset.kind = kind;
      else delete message.dataset.kind;
    }

    function busy(on) {
      for (const button of [save, toggle]) button.disabled = on;
    }

    async function apply(changes) {
      busy(true);
      say("正在保存…");
      try {
        for (const [field, value] of changes) {
          try {
            await postChange(state.id, { [field]: value });
          } catch (error) {
            throw new Error(`${fieldLabels[field]}：${error.message}`);
          }
          state.initial[field] = value;
        }
        say("已保存", "ok");
        await refresh();
      } catch (error) {
        say(error.message, "error");
      } finally {
        busy(false);
      }
    }

    save.addEventListener("click", () => {
      const changes = [];
      for (const field of numberFields) {
        const raw = inputs[field].value.trim();
        const value = field === "loadFactor" && raw === "" ? null : Number(raw);
        if (value !== state.initial[field]) changes.push([field, value]);
      }
      if (!changes.length) {
        say("没有改动");
        return;
      }
      apply(changes);
    });

    toggle.addEventListener("click", () => {
      const next = state.account.closed;
      if (!next && !confirm(`关闭 #${state.id} ${state.account.name} 的调度？手动关闭后不会自动恢复。`)) return;
      apply([["schedulable", next]]);
    });

    close.addEventListener("click", () => toggleEditor(state.account));

    state.sync = (current) => {
      state.account = current;
      toggle.textContent = current.closed ? "开启调度" : "关闭调度";
    };
    state.sync(account);
    return state;
  }

  function toggleEditor(account) {
    editor = editor?.id === account.id ? null : buildEditor(account);
    if (latest) render(latest);
    editor?.row.querySelector("input")?.focus();
  }

  function renderDecision(record) {
    let from;
    let to;
    let change = null;
    if (record.event === "manual") {
      change = `${fieldLabels[record.field] ?? record.field} `;
      from = formatValue(record.field, record.from);
      to = formatValue(record.field, record.to);
    } else if (record.event === "reopen") {
      from = "关闭";
      to = record.concurrency;
    } else {
      from = record.concurrency;
      to = record.event === "close" ? "关闭" : record.event === "floor_blocked" ? "保留" : String(record.nextConcurrency);
    }
    const row = h("tr", null,
      cell("c-time", null, h("time", null, formatClock(record.ts))),
      cell("c-event", null, eventLabels[record.event] ?? record.event),
      cell("c-account", null, h("span", "account-id", `#${record.id}`), h("span", "account-name", record.name)),
      cell("c-change", "变化",
        change,
        h("b", "figure", from),
        h("span", "arrow", "→"),
        to,
      ),
      cell("c-rate", "错误率", "rate" in record ? formatRate(record.rate) : "—"),
    );
    row.dataset.attention = String(attentionEvents.has(record.event));
    return row;
  }

  function render(data) {
    latest = data;
    const now = Date.parse(data.now);
    nodes.group.textContent = data.groupId;
    nodes.mode.textContent = data.dryRun ? "演练" : "实跑";
    nodes.lastTick.textContent = data.lastTickAt ? formatClock(data.lastTickAt) : "尚未完成";
    nodes.lastTick.title = data.lastTickAt ?? "";
    nodes.threshold.textContent = formatRate(data.policy.errorRate);
    nodes.thresholdSub.textContent = `≥ ${data.policy.minRequests} 次 / ${data.policy.windowMinutes} 分钟`;
    nodes.floor.textContent = `≥ ${data.policy.minSchedulable} 个可调度`;
    nodes.reopen.textContent = `关闭 ${formatHours(data.policy.reopenMinutes)} 小时后`;
    nodes.rateWindow.textContent = `近 ${data.policy.windowMinutes} 分钟`;

    if (data.lastError) {
      nodes.alert.hidden = false;
      nodes.alertBody.replaceChildren(
        h("b", null, `${formatClock(data.lastError.ts)} 检查失败`),
        h("span", null, data.lastError.message),
      );
    } else {
      nodes.alert.hidden = true;
    }

    const editing = editor && data.manualEnabled ? data.accounts.find((account) => account.id === editor.id) : undefined;
    if (editing) editor.sync(editing);
    else editor = null;
    const accounts = data.accounts.flatMap((account) => {
      const row = renderAccount(account, data.policy, now, data.manualEnabled);
      return account === editing ? [row, editor.row] : [row];
    });
    nodes.accounts.replaceChildren(...(accounts.length ? accounts : [emptyRow("暂无账号数据", 9)]));
    nodes.accountCount.textContent = `${data.accounts.length} 个`;

    const decisions = data.decisions.map(renderDecision);
    nodes.decisions.replaceChildren(...(decisions.length ? decisions : [emptyRow("暂无决策", 5)]));
    nodes.decisionCount.textContent = `最近 ${data.decisions.length} 条`;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/status", { cache: "no-store" });
      if (response.status === 401) {
        location.reload();
        return;
      }
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
      nodes.updated.textContent = `更新于 ${formatClock(new Date())}`;
    } catch (error) {
      nodes.updated.textContent = `刷新失败，稍后重试 · ${error.message}`;
    }
  }

  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
