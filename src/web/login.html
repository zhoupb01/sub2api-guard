<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>sub2api-guard · 登录</title>
<style>
  :root {
    --ink: #0f1729;
    --ink-2: #313c55;
    --muted: #5b6783;
    --faint: #8c97ad;
    --rule: #d6ddee;
    --rule-2: #b3c1e0;
    --accent: #2554ff;
    --wash: #f3f6ff;
    --fine: rgba(37, 84, 255, 0.045);
    --bold: rgba(37, 84, 255, 0.10);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    margin: 0;
    padding: 40px 20px;
    color: var(--ink-2);
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 1;
    background-color: #fff;
    background-image:
      linear-gradient(to right, var(--fine) 1px, transparent 1px),
      linear-gradient(to bottom, var(--fine) 1px, transparent 1px),
      linear-gradient(to right, var(--bold) 1px, transparent 1px),
      linear-gradient(to bottom, var(--bold) 1px, transparent 1px);
    background-size: 8px 8px, 8px 8px, 40px 40px, 40px 40px;
  }

  .sheet { width: min(100%, 360px); }
  .frame {
    position: relative;
    border: 1px solid var(--rule-2);
    background: rgba(255, 255, 255, 0.93);
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: -5px;
    border: 1px solid var(--rule);
    pointer-events: none;
  }
  .plate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--rule-2);
  }
  .mark {
    font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    color: var(--ink);
  }
  .mark span {
    margin-left: 12px;
    padding-left: 12px;
    border-left: 1px solid var(--rule-2);
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--muted);
  }
  form { display: grid; gap: 9px; padding: 26px 20px 24px; }
  label {
    font: 600 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  input, button { min-width: 0; min-height: 44px; border-radius: 0; font: inherit; }
  input {
    padding: 8px 10px;
    border: 1px solid var(--rule-2);
    background: #fff;
    color: var(--ink);
    font-size: 16px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    margin-top: 7px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.16em;
    cursor: pointer;
  }
  button:hover { background: #fff; color: var(--accent); }
  .feedback {
    margin: 3px 0 0;
    padding: 8px 11px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    background: var(--wash);
    color: var(--accent);
    font-size: 13px;
    line-height: 1.7;
  }

  .titleblock { border-top: 1px solid var(--rule-2); }
  .tb-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
  .tb-row:last-child { border-bottom: 0; }
  .tb-k {
    padding: 5px 6px;
    border-right: 1px solid var(--rule);
    font: 500 9.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    color: var(--faint);
  }
  .tb-v { padding: 5px 8px; font-size: 11.5px; line-height: 1.7; color: var(--ink); overflow-wrap: anywhere; }

  @media (max-width: 420px) {
    body { padding: 24px 16px; }
    .frame::before { inset: -3px; }
  }
</style>
</head>
<body>
<div class="sheet">
<div class="frame">
  <header class="plate">
    <span class="mark">SUB2API-GUARD<span>登录</span></span>
  </header>
  <form method="post" action="/login">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <!-- login-message -->
    <button type="submit">登录</button>
  </form>
  <div class="titleblock">
    <div class="tb-row"><span class="tb-k">系统</span><span class="tb-v">sub2api-guard</span></div>
    <div class="tb-row"><span class="tb-k">会话</span><span class="tb-v">30 天</span></div>
  </div>
</div>
</div>
</body>
</html>
