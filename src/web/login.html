<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sub2api-guard · 登录</title>
<style>
  :root {
    --ink: #17191f;
    --muted: #6d7480;
    --line: #e9ebef;
    --line-strong: #d6dae1;
    --accent: #3b3fd8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    margin: 0;
    padding: 24px;
    background: #fff;
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--accent);
  }
  main {
    width: min(100%, 340px);
    padding: 28px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  h1 { margin: 0 0 20px; font-size: 21px; font-weight: 600; letter-spacing: -0.015em; }
  form { display: grid; gap: 8px; }
  label { color: var(--muted); font-size: 13px; }
  input, button { min-width: 0; min-height: 42px; border-radius: 4px; font: inherit; }
  input { padding: 8px 10px; border: 1px solid var(--line-strong); font-size: 16px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .feedback { margin: 4px 0 0; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>sub2api-guard</h1>
  <form method="post" action="/login">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <!-- login-message -->
    <button type="submit">登录</button>
  </form>
</main>
</body>
</html>
