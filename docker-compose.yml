services:
  sub2api-guard:
    image: ${REGISTRY:?set REGISTRY in .env}/sub2api-guard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # A running probe needs time to put its account back on SIGTERM.
    stop_grace_period: 30s
    env_file: .env
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.sub2api-guard.entrypoints=websecure'
      - 'traefik.http.routers.sub2api-guard.rule=Host(`${GUARD_HOST:?set GUARD_HOST in .env}`)'
      - 'traefik.http.services.sub2api-guard.loadbalancer.server.port=8080'
    volumes:
      - ./data:/data
    networks:
      - sub2api-deploy_sub2api-network
      - proxy

networks:
  proxy:
    external: true
  sub2api-deploy_sub2api-network:
    external: true
