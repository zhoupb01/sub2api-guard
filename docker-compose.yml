services:
  sub2api-guard:
    image: ${REGISTRY:-registry.cn-hangzhou.aliyuncs.com/zhoupb}/sub2api-guard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.sub2api-guard.entrypoints=websecure'
      - 'traefik.http.routers.sub2api-guard.rule=Host(`sub2api-guard.zhoupb.com`)'
      - 'traefik.http.services.sub2api-guard.loadbalancer.server.port=8080'
    volumes:
      - ./data:/data
    networks:
      - sub2api-deploy_sub2api-network
      - proxy

networks:
  proxy:
    external: true
  sub2api-deploy_sub2api-network:
    external: true
